[project]
name = "setup1"
version = "0.1.0"
description = "Python 데이터·ML 팀 협업 기준 저장소"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "rinaking" }]
dependencies = [
    "numpy>=2.2,<3",
    "pandas>=2.2.3,<4",
]

[dependency-groups]
dev = [
    "ruff>=0.15,<0.18",
    "mypy>=1.18,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "pre-commit>=4,<5",
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.2,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/setup1"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PL", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "possibly-undefined"]
files = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --cov=setup1 --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["setup1"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
